<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprouty's Garden Trail</title>
<link rel="stylesheet" href="../../libs/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="game.css">
</head>
<body>
<main class="container py-3">
  <a href="../../index.html" class="btn btn-sm btn-outline-success mb-2">Back to Sprouty</a>

  <section id="menu" class="panel text-center">
    <h1>Sprouty's Garden Trail</h1>
    <p class="lead">Roll the dice, answer questions and grow your garden. Work together to keep the planet healthy!</p>
    <p class="fw-bold mb-2">How many players?</p>
    <div id="count" class="d-flex gap-2 justify-content-center flex-wrap"></div>
    <p id="stats" class="mt-3 mb-1 fw-bold"></p>
    <p class="small text-muted mb-0">Inspired by the Go Goals! SDG board game by the United Nations.</p>
  </section>

  <section id="game" hidden>
    <button id="toMenu" class="btn btn-sm btn-outline-success mb-2">Back to game menu</button>
    <div id="hud" class="panel mb-2"></div>
    <div id="board" aria-label="Game board"></div>
    <div class="panel mt-2 text-center">
      <p id="msg" class="fw-bold mb-2" aria-live="polite"></p>
      <div id="dice">&#9856;</div>
      <button id="roll" class="btn btn-lg btn-warning fw-bold">Roll two dice</button>
    </div>
  </section>

  <div id="modal" hidden>
    <div id="dlg" role="dialog" aria-modal="true">
      <div id="dlgBody"></div>
      <div id="dlgBtns" class="d-grid gap-2 mt-3"></div>
      <button id="say" class="btn btn-sm btn-outline-secondary mt-2" hidden>Read aloud</button>
    </div>
  </div>
</main>
<script src="../../libs/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="game.js"></script>
</body>
</html>
