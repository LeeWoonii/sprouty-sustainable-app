<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Detectives</title>
<link rel="stylesheet" href="../../libs/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="game.css">
</head>
<body>
<main class="container py-3">
  <a href="../../index.html" class="btn btn-sm btn-outline-success mb-2">Back to Sprouty</a>

  <section id="menu" class="panel text-center">
    <h1>Time Detectives</h1>
    <p class="lead">Find the mystery rubbish, guess how long it will stay around, then jump in Sprouty's time machine to find out the truth!</p>
    <button id="start" class="btn btn-lg btn-success">Start the mystery</button>
    <p id="stats" class="mt-3 mb-1 fw-bold"></p>
    <p class="small text-muted mb-0">Rubbish lifespans are rough averages: real times change with weather and place.</p>
  </section>

  <section id="play" hidden>
    <button id="toMenu" class="btn btn-sm btn-outline-success mb-2">Back to game menu</button>
    <div id="hud" class="panel mb-2"></div>
    <div id="scene" aria-label="Scene with mystery items"></div>
  </section>

  <div id="modal" hidden>
    <div id="dlg" role="dialog" aria-modal="true">
      <div id="dlgBody"></div>
      <div id="dlgBtns" class="d-grid gap-2 mt-3"></div>
      <button id="say" class="btn btn-sm btn-outline-secondary mt-2" hidden>Read aloud</button>
    </div>
  </div>
</main>
<script src="../../libs/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="game.js"></script>
</body>
</html>
